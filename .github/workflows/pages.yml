name: Publish product guide

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'demo/**'
      - 'src/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static product guide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test local experience
        run: npm run demo:test

      - name: Build product experience
        run: npm run demo:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
